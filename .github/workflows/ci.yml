name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Generated output is up to date
        run: npm run generate:example && git diff --exit-code generated/

      - name: Package contents
        run: npm pack --dry-run

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: ghcr.io/supabase/postgres:15.19.0.007
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Supabase auth stand-ins
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U supabase_admin -d postgres -c "
            CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS \$\$
              SELECT coalesce(nullif(current_setting('request.jwt.claim', true), ''),
                              nullif(current_setting('request.jwt.claims', true), ''))::jsonb \$\$;
            GRANT EXECUTE ON FUNCTION auth.jwt() TO anon, authenticated;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$
              SELECT coalesce(nullif(current_setting('request.jwt.claim.sub', true), ''),
                              (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub'))::uuid \$\$;
            ALTER ROLE authenticator WITH LOGIN PASSWORD 'postgres';
            ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS email_confirmed_at timestamptz;"

      - name: Prepare Supabase Realtime stand-ins
        run: |
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -c "
            CREATE TABLE IF NOT EXISTS realtime.messages (
              id uuid NOT NULL DEFAULT gen_random_uuid(), topic text NOT NULL, extension text NOT NULL,
              payload jsonb, event text, private boolean DEFAULT false,
              inserted_at timestamp NOT NULL DEFAULT now(), updated_at timestamp NOT NULL DEFAULT now());
            ALTER TABLE realtime.messages ENABLE ROW LEVEL SECURITY;
            CREATE OR REPLACE FUNCTION realtime.topic() RETURNS text LANGUAGE sql STABLE AS \$\$
              SELECT nullif(current_setting('realtime.topic', true), '')::text \$\$;
            GRANT USAGE ON SCHEMA realtime TO postgres, anon, authenticated;
            GRANT SELECT, INSERT ON realtime.messages TO anon, authenticated;
            GRANT EXECUTE ON FUNCTION realtime.topic() TO anon, authenticated;
            ALTER TABLE realtime.messages OWNER TO postgres;"

      - name: Start PostgREST
        run: |
          docker run -d --rm --name accessnexus-test-rest --network host \
            -e PGRST_DB_URI=postgres://authenticator:postgres@127.0.0.1:55439/postgres \
            -e PGRST_DB_ANON_ROLE=anon -e PGRST_DB_SCHEMAS=public -e PGRST_SERVER_PORT=55440 \
            -e PGRST_JWT_SECRET=accessnexus-test-jwt-secret-at-least-32-chars \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:55440/ >/dev/null && exit 0; sleep 1; done
          docker logs accessnexus-test-rest; exit 1

      - name: Integration tests
        env:
          ACCESSNEXUS_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:55439/postgres
          ACCESSNEXUS_TEST_REST_URL: http://127.0.0.1:55440
        run: npx vitest run push.integration realtime.integration sdk.integration saas-teams.integration migration-discard
